<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Escape Room — Agent World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Escape Room</h1>
        <div id="status">Loading…</div>
    </header>

    <main>
        <section id="grid-container">
            <canvas id="grid" width="600" height="480"></canvas>
        </section>

        <aside id="sidebar">
            <h2>Movement</h2>
            <div id="movement-actions"></div>

            <h2>Interactions</h2>
            <div id="interaction-actions"></div>

            <h2>Log</h2>
            <div id="log"></div>

            <button id="reset">Reset</button>

            <h2>Agent</h2>
            <div id="agent-controls">
                <button id="agent-step">Step Once</button>
                <button id="agent-run">Run Until Done</button>
                <button id="agent-stop" disabled>Stop</button>
            </div>
            <div id="agent-status">Idle</div>
            <div id="agent-thought"></div>
            <div id="agent-scratchpad-section">
                <h3>Scratchpad</h3>
                <div id="agent-scratchpad"></div>
            </div>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
